[package]
name = "sg2002-upper"
version = "0.1.0"
edition = "2024"
description = "SG2002 上位机：YOLO 网球检测 + 视觉伺服，经 UART 驱动 ESP32-C3 双电机小车"
license = "MIT"

[dependencies]
libc = "0.2"
v4l = "0.14.0"
cviruntime-rs = { path = "cviruntime-rs" }
cvimpi-rs = { path = "cvimpi-rs" }
rouille = "3.6.2"
log = "0.4"
simple_logger = { version = "5.2", features = ["stderr"] }
time = { version = "0.3", features = ["macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
clap = { version = "4.6.7", features = ["derive"] }
protocol = { path = "../protocol" }

# 整合入口：视觉（相机 YUYV + TPU + 同帧预览）+ 网页遥控（手动/自动切换）。
[[bin]]
name = "smartcar"
path = "src/bin/smartcar.rs"

[profile.release]
lto = true
codegen-units = 1

[dev-dependencies]
tungstenite = "0.30.0"
