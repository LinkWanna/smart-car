# smartcar-ap.conf —— 小车 AP 端点配置（flash.sh 部署到 /etc/smartcar-ap.conf）
#
# S98apstart 直接读取本文件，没有内置默认值；改完执行以下命令生效：
#   /etc/init.d/S98apstart restart

# 无线接口（WiFi 板为 wlan0；接口不存在时建热点会跳过）
AP_IFACE=wlan0

# AP 地址（/24；DHCP 池固定为同网段 .128-.191）
AP_IP=192.168.1.2

# SSID 前缀：实际 SSID = <前缀>-<wlan MAC 后 4 位>
AP_SSID_PREFIX=smartcar

# WPA2 密码（8..63 字符；显式置空 = 开放热点，仅调试用）
AP_PASS=88888888

# 信道（1..13）与国家码
AP_CHANNEL=6
AP_COUNTRY=CN
